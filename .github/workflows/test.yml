name: PR Test

on:
  pull_request:
    branches:
      - 'main'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check gofmt formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          # The codebase had no linter before this pass; only-new-issues keeps
          # the gate from failing every PR on pre-existing debt while still
          # blocking new issues. See katra for the tracked legacy-cleanup task.
          only-new-issues: true

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Verify Go builds
        run: |
          go build ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/frontend/package-lock.json'

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Run tests with coverage
        run: |
          # Run tests that work without network access and generate coverage
          go test -coverprofile=coverage.out ./models ./targets/homeassistant ./targets/memoryStore ./services/leagues/nhl ./services/leagues/mlb ./services/leagues/iihf ./utils ./config ./clients/...
          
          # Run main package tests that work without network
          go test -coverprofile=main_coverage.out -v -run="TestTeamIsMonitored|TestGameIsMonitored|TestSendTestGoal|TestFireGoalEvents" .
          
          # Combine coverage files
          echo "mode: set" > combined_coverage.out
          grep -h -v "^mode:" coverage.out main_coverage.out >> combined_coverage.out || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./combined_coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Coverage Report
        run: |
          go tool cover -func=combined_coverage.out | tail -1
          echo "Coverage report uploaded to Codecov"

